[project]
name = "ai-support-system"
version = "0.1.0"
description = "AI-based Product Support System with ticket classification, Graph-RAG, and hybrid vector search"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "sentence-transformers>=3.0",
    "networkx>=3.2",
    "pymilvus>=2.4",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
serve = "src.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
